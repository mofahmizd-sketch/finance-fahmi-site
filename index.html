<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تحليل مالي - 3 سنوات</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: "Cairo", sans-serif; background:#f7f8fa; }
    .card { margin-bottom:20px; }
    .section-title { font-weight:700; }
  </style>
</head>
<body class="container py-4">

  <h1 class="mb-4">📊 منصة تحليل مالي لثلاث سنوات</h1>
  <p>أدخل بيانات الميزانية العمومية وقائمة الدخل لثلاث سنوات، وسيتم حساب مؤشرات السيولة، الرافعة المالية، والربحية.</p>

  <!-- نموذج إدخال البيانات -->
  <form id="financeForm">
    <div class="row">
      <!-- لكل سنة -->
      <div class="col-md-4">
        <div class="card p-3">
          <h5 class="section-title">السنة 1</h5>
          <label>الأصول المتداولة</label>
          <input type="number" class="form-control" id="currentAssets1" required>
          <label>الخصوم المتداولة</label>
          <input type="number" class="form-control" id="currentLiabilities1" required>
          <label>إجمالي الدين</label>
          <input type="number" class="form-control" id="debt1" required>
          <label>حقوق الملكية</label>
          <input type="number" class="form-control" id="equity1" required>
          <label>الإيرادات</label>
          <input type="number" class="form-control" id="revenue1" required>
          <label>صافي الربح</label>
          <input type="number" class="form-control" id="netIncome1" required>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3">
          <h5 class="section-title">السنة 2</h5>
          <label>الأصول المتداولة</label>
          <input type="number" class="form-control" id="currentAssets2" required>
          <label>الخصوم المتداولة</label>
          <input type="number" class="form-control" id="currentLiabilities2" required>
          <label>إجمالي الدين</label>
          <input type="number" class="form-control" id="debt2" required>
          <label>حقوق الملكية</label>
          <input type="number" class="form-control" id="equity2" required>
          <label>الإيرادات</label>
          <input type="number" class="form-control" id="revenue2" required>
          <label>صافي الربح</label>
          <input type="number" class="form-control" id="netIncome2" required>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3">
          <h5 class="section-title">السنة 3</h5>
          <label>الأصول المتداولة</label>
          <input type="number" class="form-control" id="currentAssets3" required>
          <label>الخصوم المتداولة</label>
          <input type="number" class="form-control" id="currentLiabilities3" required>
          <label>إجمالي الدين</label>
          <input type="number" class="form-control" id="debt3" required>
          <label>حقوق الملكية</label>
          <input type="number" class="form-control" id="equity3" required>
          <label>الإيرادات</label>
          <input type="number" class="form-control" id="revenue3" required>
          <label>صافي الربح</label>
          <input type="number" class="form-control" id="netIncome3" required>
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary mt-3">تحليل البيانات</button>
  </form>

  <!-- النتائج -->
  <div class="card p-3 mt-4">
    <h4 class="section-title">نتائج المؤشرات المالية</h4>
    <div id="results"></div>
  </div>

  <!-- الرسم البياني -->
  <div class="card p-3 mt-4">
    <h4 class="section-title">تطور المؤشرات عبر السنوات</h4>
    <canvas id="metricsChart"></canvas>
  </div>

<script>
document.getElementById("financeForm").addEventListener("submit", function(e){
  e.preventDefault();

  const years = [1,2,3];
  const liquidity = [], leverage = [], profitability = [];

  years.forEach(y=>{
    const ca = parseFloat(document.getElementById("currentAssets"+y).value);
    const cl = parseFloat(document.getElementById("currentLiabilities"+y).value);
    const debt = parseFloat(document.getElementById("debt"+y).value);
    const equity = parseFloat(document.getElementById("equity"+y).value);
    const revenue = parseFloat(document.getElementById("revenue"+y).value);
    const netIncome = parseFloat(document.getElementById("netIncome"+y).value);

    // مؤشرات
    const currentRatio = (cl===0)?0:(ca/cl); // السيولة
    const deRatio = (equity===0)?0:(debt/equity); // الرافعة المالية
    const netMargin = (revenue===0)?0:(netIncome/revenue); // الربحية

    liquidity.push(currentRatio.toFixed(2));
    leverage.push(deRatio.toFixed(2));
    profitability.push((netMargin*100).toFixed(2));
  });

  // عرض النتائج
  let html = "<table class='table table-bordered'><thead><tr><th>السنة</th><th>نسبة السيولة (Current Ratio)</th><th>نسبة الدين إلى حقوق الملكية (D/E)</th><th>هامش الربح الصافي (%)</th></tr></thead><tbody>";
  years.forEach((y,i)=>{
    html += `<tr><td>${y}</td><td>${liquidity[i]}</td><td>${leverage[i]}</td><td>${profitability[i]}</td></tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("results").innerHTML = html;

  // رسم بياني
  const ctx = document.getElementById("metricsChart").getContext("2d");
  new Chart(ctx, {
    type: "line",
    data: {
      labels: ["السنة 1","السنة 2","السنة 3"],
      datasets: [
        { label:"السيولة", data:liquidity, borderColor:"#2a5298", fill:false },
        { label:"الرافعة المالية", data:leverage, borderColor:"#e67e22", fill:false },
        { label:"الربحية (%)", data:profitability, borderColor:"#27ae60", fill:false }
      ]
    },
    options: { responsive:true, plugins:{ legend:{ position:"bottom" } } }
  });
});
</script>

</body>
</html>
